name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build release package
        run: sh scripts/build-release.sh release
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/VaultBridge-unsigned.ipa
            release/VaultBridge.dSYM.zip
            release/VaultBridge.spdx.json
            release/THIRD_PARTY_NOTICES.md
            release/SHA256SUMS
